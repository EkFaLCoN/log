name: Build

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Zip dosyalarını aç
        run: |
          shopt -s nullglob
          for z in *.zip; do
            echo "Açılıyor: $z"
            mkdir -p "_kaynak/${z%.zip}"
            unzip -o -q "$z" -d "_kaynak/${z%.zip}"
          done
          ls -R _kaynak | head -50

      - name: Proje klasörünü bul
        id: proje
        run: |
          POM=$(find _kaynak . -maxdepth 4 -name pom.xml -not -path "./.git/*" | head -n 1)
          if [ -z "$POM" ]; then echo "pom.xml bulunamadı!"; exit 1; fi
          echo "dir=$(dirname "$POM")" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Derle
        working-directory: ${{ steps.proje.outputs.dir }}
        run: mvn -B -q package

      - name: Jar dosyasını topla
        run: |
          mkdir -p cikti
          cp "${{ steps.proje.outputs.dir }}"/target/*.jar cikti/
          ls -la cikti

      - uses: actions/upload-artifact@v4
        with:
          name: GirisSistemi-jar
          path: cikti/*.jar

      - name: Release olarak yayınla (telefondan indirmek için)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" cikti/*.jar \
            --title "Build ${{ github.run_number }}" \
            --notes "Otomatik derleme (commit ${GITHUB_SHA::7})"
